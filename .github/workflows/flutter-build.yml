name: Build Avelut Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: avelut_flutter

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Save custom pubspec before flutter create
        run: cp avelut_flutter/pubspec.yaml avelut_flutter/pubspec.yaml.bak

      - name: Generate native project (flutter create)
        working-directory: avelut_flutter
        run: flutter create --overwrite .

      - name: Restore custom pubspec with dependencies
        run: cp avelut_flutter/pubspec.yaml.bak avelut_flutter/pubspec.yaml

      - name: Install dependencies
        working-directory: avelut_flutter
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: avelut_flutter
        run: flutter analyze

      - name: Build release APK
        working-directory: avelut_flutter
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: avelut-release-apk
          path: avelut_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
