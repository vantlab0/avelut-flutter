name: avelut_flutter
description: Avelut — The study partner that actually teaches you. Rebuilt in Flutter.
publish_to: "none"
version: 6.0.65+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Supabase (auth, realtime, database, storage, edge functions)
  supabase_flutter: ^2.6.1

  # Local storage
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # AI / Voice / OCR
  google_ml_kit: ^0.13.0
  record: ^5.1.1
  just_audio: ^0.9.36
  http: ^1.2.2
  dio: ^5.5.0+1

  # Push notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Utilities
  share_plus: ^9.0.1
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  equatable: ^2.0.5

  # JSON serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Regular.ttf
        - asset: assets/fonts/SF-Pro-Text-Medium.ttf
          weight: 500
        - asset: assets/fonts/SF-Pro-Text-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SF-Pro-Text-Bold.ttf
          weight: 700
